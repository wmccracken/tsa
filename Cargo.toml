[package]
name = "tsa"
version = "0.1.0"
edition = "2024"
description = "CLI tool to update Tailscale device tags"

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
reqwest = { version = "0.12", features = ["json", "blocking"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tokio = { version = "1", features = ["full"] }
colored = "2"
comfy-table = "7"
dialoguer = "0.11"
console = "0.15"
chrono = "0.4"
