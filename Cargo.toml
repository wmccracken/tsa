[package]
name = "tsa"
version = "0.1.1"
edition = "2024"
description = "CLI tool for managing Tailscale device tags and signing locked nodes"
authors = ["Will McCracken <tsa@lattefiend.com>"]
license = "MIT"
repository = "https://github.com/wmccracken/tsa"
readme = "README.md"

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
reqwest = { version = "0.13", features = ["json", "blocking"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tokio = { version = "1", features = ["full"] }
colored = "3.1.1"
comfy-table = "7"
dialoguer = "0.12.0"
console = "0.16.3"
chrono = "0.4"
